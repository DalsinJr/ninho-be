services:
  postgres:
    image: postgres:17-alpine
    container_name: ninho-postgres
    environment:
      POSTGRES_DB: ninho
      POSTGRES_USER: ninho
      POSTGRES_PASSWORD: ninho
    ports:
      - "15440:5432"
    volumes:
      - ninho-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: ninho-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ninho
      MINIO_ROOT_PASSWORD: ninho12345
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ninho-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fica vivo depois de criar o bucket: o Spring sobe o Compose com `up --wait`, que falha
  # quando um contêiner de execução única termina (mesmo com código 0).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ninho ninho12345 &&
        mc mb --ignore-existing local/ninho-curriculos &&
        mc anonymous set none local/ninho-curriculos &&
        exec sleep infinity
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: ninho-mailpit
    ports:
      - "11025:1025"
      - "18025:8025"

volumes:
  ninho-postgres:
  ninho-minio:
